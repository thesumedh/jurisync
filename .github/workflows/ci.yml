name: CI Matrix Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Target Flow Verification
        run: node tests/verify-target-flow.js

      - name: Run Signal Extraction Tests (Slice 2)
        run: node tests/verify-slice2.js

      - name: Run Sourced Rule Engine Tests (Slice 3)
        run: node tests/verify-slice3.js

      - name: Run Tension Engine & Checklist Tests (Slice 4)
        run: node tests/verify-slice4.js

      - name: Run Model Context Protocol Stdio Tests (Slice 5)
        run: node tests/verify-slice5.js

      - name: Build Web Application
        run: npm run build
